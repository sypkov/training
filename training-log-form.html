<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дневник тренировок</title>
<link rel="apple-touch-icon" href="Shield.png">
<style>
  :root {
    --bg: #131316; --card: #1c1c20; --line: #2c2c31; --text: #eceae6; --text-dim: #8f8d8a;
    --orange: #FF5A1F; --teal: #12D6B8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 18px 60px; }
  .eyebrow { color: var(--orange); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
  h1 { font-size: 24px; font-weight: 800; margin-bottom: 20px; }
  label { display: block; font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin: 16px 0 6px; }
  select, input {
    width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font-size: 16px; color: var(--text); font-family: inherit;
  }
  select:focus, input:focus { outline: none; border-color: var(--orange); }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  button {
    width: 100%; margin-top: 26px; background: var(--orange); color: #fff; border: none;
    border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  button:active { opacity: 0.85; }
  button:disabled { background: #555; }
  .msg { margin-top: 14px; font-size: 13px; text-align: center; padding: 10px; border-radius: 8px; display: none; }
  .msg.ok { display: block; background: #12D6B822; color: var(--teal); }
  .msg.err { display: block; background: #FF5A1F22; color: var(--orange); }
  .settings { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); }
  .settings summary { cursor: pointer; font-size: 12px; color: var(--text-dim); }
  .last-set { font-size: 12px; color: var(--text-dim); margin-top: 8px; }

  .plan-box { margin-top: 18px; }
  .plan-title { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
  .plan-item {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
  }
  .plan-item:active { border-color: var(--orange); }
  .plan-item .plan-ex { font-size: 13px; }
  .plan-item .plan-wr { font-size: 12px; color: var(--teal); font-family: ui-monospace, monospace; white-space: nowrap; margin-left: 10px; }
  .plan-empty { font-size: 12px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Тоннаж · Прогресс</div>
  <h1>Записать подход</h1>

  <label>Дата</label>
  <input type="date" id="date">

  <div class="plan-box" id="planBox">
    <div class="plan-title">План на эту дату</div>
    <div id="planList"><div class="plan-empty">Загрузка…</div></div>
  </div>

  <label>Мышечная группа</label>
  <select id="muscleGroup"></select>

  <label>Упражнение</label>
  <select id="exercise"></select>

  <div class="row2">
    <div>
      <label>Вес, кг</label>
      <input type="number" id="weight" inputmode="decimal" step="0.5" min="0" placeholder="напр. 40">
    </div>
    <div>
      <label>Повторения</label>
      <input type="number" id="reps" inputmode="numeric" step="1" min="1" placeholder="напр. 12">
    </div>
  </div>

  <button id="submitBtn" onclick="submitSet()">Записать подход</button>
  <div class="last-set" id="lastSet"></div>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <a href="https://sypkov.github.io/training/training-dashboard.html" style="display:block;text-align:center;margin-top:18px;color:var(--teal);text-decoration:none;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:12px;padding:13px;">
    📊 Открыть тренировочный дашборд
  </a>

  <details class="settings">
    <summary>Настройки подключения</summary>
    <label>URL Apps Script (Web App)</label>
    <input type="url" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <button style="margin-top:10px;background:#2c2c31;" onclick="saveUrl()">Сохранить URL</button>
    <button id="checkBtn" style="margin-top:10px;background:#2c2c31;" onclick="checkConnection()">Проверить подключение</button>
    <div class="last-set" id="connectionStatus" role="status" aria-live="polite"></div>
  </details>
</div>

<script>
const EXERCISES = {
  "Грудь": ["Жим на грудь в рычажном тренажёре лёжа", "Жим на грудь в рычажном тренажёре сидя", "Бабочка", "Жим в рычажном тренажере (Хаммер) сидя", "Жим на грудь на наклонной скамье в тренажёре"],
  "Спина": ["Тяга верхнего блока", "Тяга горизонтальная рычажная по одной руке", "Тяга upper блока", "Горизонтальная тяга с упором сидя", "Тяга гантели в наклоне одной рукой (дома)"],
  "Плечи": ["Жим от плеч сидя в рычажном тренажёре", "Тяга штанги к подбородку", "Отведение плеча в блочном тренажёре", "Подъёмы гантелей перед собой", "Жим в блочном тренажёре на плечи", "Махи гантелей через стороны сидя", "Обратная бабочка (Rear Delt)", "Жим Арнольда сидя одной рукой (дома)", "Отведение в наклоне одной рукой (дома)"],
  "Плечи/спина": ["Отведение на спину в рычажном тренажёре"],
  "Бицепс": ["Сгибание на бицепс сидя в блочном тренажёре", "Сгибание на бицепс на скамье", "Молоток в тренажёре", "Dependent curl", "Сгибание на бицепс с гантелью (дома)"],
  "Трицепс": ["Трицепс в тренажёре сидя", "Разгибание рук на верхнем блоке", "Жим на трицепс в рычажном тренажере (сидя)", "Разгибание руки с гантелью из-за головы"],
  "Ноги": ["Разгибание голени сидя в блочном тренажёре", "Жим ногами с фокусом на ягодицы", "Сгибание коленей в блочном тренажёре", "Гоблет-присед (дома)", "Подъёмы на носки с гантелью (дома)", "Выпады с гантелью (дома)"],
};

const mgSelect = document.getElementById('muscleGroup');
const exSelect = document.getElementById('exercise');

Object.keys(EXERCISES).forEach(mg => {
  const opt = document.createElement('option');
  opt.value = mg; opt.textContent = mg;
  mgSelect.appendChild(opt);
});

function refreshExercises() {
  const mg = mgSelect.value;
  exSelect.innerHTML = '';
  (EXERCISES[mg] || []).forEach(ex => {
    const opt = document.createElement('option');
    opt.value = ex; opt.textContent = ex;
    exSelect.appendChild(opt);
  });
}
mgSelect.addEventListener('change', refreshExercises);
refreshExercises();

// Дата дневника — по часовому поясу таблицы.
const dateInput = document.getElementById('date');
const todayParts = new Intl.DateTimeFormat('en-GB', {
  timeZone: 'Europe/Saratov', year: 'numeric', month: '2-digit', day: '2-digit'
}).formatToParts(new Date());
dateInput.value = ['year', 'month', 'day'].map(type => todayParts.find(p => p.type === type).value).join('-');

const urlInput = document.getElementById('scriptUrl');
let activeScriptUrl = '';
function validScriptUrl(value) {
  try {
    const url = new URL(value);
    return url.protocol === 'https:' && url.hostname === 'script.google.com' &&
      new RegExp('^/macros/s/[A-Za-z0-9_-]+/exec$').test(url.pathname) && !url.search && !url.hash;
  } catch { return false; }
}
try { activeScriptUrl = localStorage.getItem('training_script_url') || ''; } catch {}
const connectUrl = new URLSearchParams(location.hash.slice(1)).get('connect');
if (connectUrl && validScriptUrl(connectUrl)) {
  activeScriptUrl = connectUrl;
  try {
    localStorage.setItem('training_script_url', activeScriptUrl);
    history.replaceState(null, '', location.pathname + location.search);
  } catch {}
}
if (!validScriptUrl(activeScriptUrl)) activeScriptUrl = '';
urlInput.value = activeScriptUrl;
document.getElementById('connectionStatus').textContent = activeScriptUrl
  ? 'Адрес подключения настроен' : 'Подключение не настроено. Укажи URL Apps Script.';

function saveUrl() {
  const value = urlInput.value.trim();
  if (!validScriptUrl(value)) {
    showMsg('err', 'Нужен полный адрес веб-приложения Apps Script, заканчивающийся на /exec');
    return;
  }
  activeScriptUrl = value;
  try {
    localStorage.setItem('training_script_url', value);
    showMsg('ok', 'URL сохранён');
  } catch {
    showMsg('err', 'Браузер не разрешил сохранить адрес. Он доступен до закрытия страницы.');
  }
  checkConnection();
  loadPlanned();
}

let messageTimer;
function showMsg(type, text) {
  clearTimeout(messageTimer);
  const el = document.getElementById('msg');
  el.className = 'msg ' + type;
  el.textContent = text;
  if (type !== 'err') messageTimer = setTimeout(() => { el.className = 'msg'; }, 12000);
}

async function checkConnection() {
  const status = document.getElementById('connectionStatus');
  const btn = document.getElementById('checkBtn');
  if (!activeScriptUrl) { status.textContent = 'Сначала сохрани URL Apps Script'; return; }
  btn.disabled = true;
  status.textContent = 'Проверяю подключение…';
  try {
    const health = await fetch(activeScriptUrl);
    if (!health.ok) throw new Error('HTTP ' + health.status);
    const server = await health.json();
    if (server.status !== 'ok' || server.version !== '2026-11-23') throw new Error('Обнови адрес подключения: сервер использует старую версию');
    const res = await fetch(activeScriptUrl, {
      method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({dryRun: true, date: dateToRu(dateInput.value),
        exercise: 'Проверка подключения', muscleGroup: 'Проверка', weight: '1,5', reps: 2})
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (json.status !== 'ok' || json.dryRun !== true || json.tonnage !== 3) throw new Error(json.message || 'Сервер требует обновления');
    status.textContent = 'Подключение работает. Проверка выполнена без записи в дневник.';
  } catch (err) {
    status.textContent = 'Подключение не подтверждено: ' + err.message;
  } finally { btn.disabled = false; }
}

function dateToRu(dateVal) {
  const [y,m,d] = dateVal.split('-');
  return `${d}.${m}.${y}`;
}

async function loadPlanned() {
  const scriptUrl = activeScriptUrl;
  const planListEl = document.getElementById('planList');
  if (!scriptUrl) {
    planListEl.innerHTML = '<div class="plan-empty">Сохрани URL Apps Script, чтобы видеть план</div>';
    return;
  }
  const dateRu = dateToRu(dateInput.value);
  planListEl.innerHTML = '<div class="plan-empty">Загрузка…</div>';
  try {
    const res = await fetch(`${scriptUrl}?action=getPlanned&date=${encodeURIComponent(dateRu)}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (json.status !== 'ok') throw new Error(json.message || 'Ошибка сервера');
    if (json.status === 'ok' && json.planned && json.planned.length > 0) {
      planListEl.innerHTML = '';
      json.planned.forEach(p => {
        let wr;
        if (p.weight && p.reps) wr = `${p.weight}×${p.reps}`;
        else if (p.weight) wr = `${p.weight} кг · повторы не заданы`;
        else if (p.reps) wr = `вес не задан · ${p.reps} повт.`;
        else wr = 'вес/повторы не заданы';
        const div = document.createElement('div');
        div.className = 'plan-item';
        div.innerHTML = `<span class="plan-ex">${p.exercise}</span><span class="plan-wr">${wr}</span>`;
        div.onclick = () => fillFromPlan(p);
        planListEl.appendChild(div);
      });
    } else {
      planListEl.innerHTML = '<div class="plan-empty">На эту дату плана нет</div>';
    }
  } catch (err) {
    planListEl.innerHTML = '<div class="plan-empty">Не удалось загрузить план</div>';
  }
}

function fillFromPlan(p) {
  const wantedGroup = (p.muscleGroup || '').trim();
  const wantedExercise = (p.exercise || '').trim();

  // Ищем ключ группы без учёта регистра/пробелов, чтобы select.value точно сработал
  const groupKey = Object.keys(EXERCISES).find(
    k => k.trim().toLowerCase() === wantedGroup.toLowerCase()
  ) || wantedGroup;

  if (!Array.from(mgSelect.options).some(o => o.value === groupKey) && groupKey) {
    const opt = document.createElement('option');
    opt.value = groupKey; opt.textContent = groupKey;
    mgSelect.appendChild(opt);
  }
  mgSelect.value = groupKey;
  refreshExercises();

  // Если упражнения нет в списке для этой группы — добавляем временный вариант,
  // чтобы оно всё равно отобразилось и было отправлено как есть
  const exerciseExists = Array.from(exSelect.options).some(o => o.value === wantedExercise);
  if (!exerciseExists && wantedExercise) {
    const opt = document.createElement('option');
    opt.value = wantedExercise; opt.textContent = wantedExercise + ' (из плана)';
    exSelect.appendChild(opt);
  }
  exSelect.value = wantedExercise;

  if (p.weight) document.getElementById('weight').value = p.weight;
  if (p.reps) document.getElementById('reps').value = p.reps;
  showMsg('ok', `Заполнено из плана: ${wantedExercise}`);
}

dateInput.addEventListener('change', loadPlanned);
loadPlanned();

async function submitSet() {
  const scriptUrl = activeScriptUrl;
  if (!scriptUrl) {
    showMsg('err', 'Сначала сохрани URL Apps Script в настройках ниже');
    return;
  }
  const weight = document.getElementById('weight').value;
  const reps = document.getElementById('reps').value;
  if (weight === '' || !Number.isFinite(Number(weight)) || Number(weight) < 0 || !Number.isInteger(Number(reps)) || Number(reps) < 1 || !dateInput.value || !exSelect.value || !mgSelect.value) {
    showMsg('err', 'Проверь дату, упражнение, вес и число повторений');
    return;
  }

  const dateFormatted = dateToRu(document.getElementById('date').value);

  const payload = {
    date: dateFormatted,
    exercise: exSelect.value,
    muscleGroup: mgSelect.value,
    weight: weight,
    reps: reps,
  };

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Записываю...';

  try {
    const res = await fetch(scriptUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // избегаем preflight CORS
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (json.status === 'ok') {
      const overwriteNote = json.overwritten ? ' (заменена плановая запись)' : '';
      showMsg('ok', `Записано: ${payload.exercise} — ${weight}×${reps} = ${json.tonnage} кг тоннажа${overwriteNote}`);
      document.getElementById('lastSet').textContent = `Последний подход: ${payload.exercise}, ${weight} кг × ${reps}`;
      document.getElementById('reps').value = '';
      loadPlanned();
    } else {
      showMsg('err', 'Ошибка: ' + json.message);
    }
  } catch (err) {
    showMsg('err', 'Сохранение не подтверждено: ' + err.message + '. Проверь таблицу перед повторной отправкой. Введённые значения сохранены в форме.');
  } finally {
    btn.disabled = false; btn.textContent = 'Записать подход';
  }
}
</script>
</body>
</html>
